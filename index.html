    <div class="card stage fade-in">
      <div class="over-emoji">${info.emoji}</div>
      <h2 style="text-align:center">GAME OVER · ${info.title}</h2>
      <p class="result-text" style="text-align:center">${s.result && e.type === 'expel' ? s.result.text + '<br><br>' : ''}${info.msg}</p>
      <div class="alert">${e.reason}</div>
      <p style="text-align:center">버틴 기간: <b>${turnLabel(s.turn)}</b> (${s.turn}/${CONFIG.TOTAL_TURNS}턴)</p>
      ${finalStatsHTML()}
      ${examListHTML()}
      ${achvEndHTML()}
        <div class="btn-row"><button class="btn yellow" data-action="new">🔁 다시 입학하기</button><button class="btn ghost" data-action="home">처음 화면</button></div>
    </div>`;
}

function logHTML() {
  let items = '', lastTurn = 0;
  for (const l of s.log) {
    if (l.turn !== lastTurn) { items += `<div class="log-turn">${turnLabel(l.turn)}</div>`; lastTurn = l.turn; }
    items += `<div class="log-item"><span>${l.icon}</span><span>${esc(l.text)}</span></div>`;
  }
  const open = logOpen || s.phase === 'ending' || s.phase === 'gameover';
  return `
    <details class="card log" id="logBox" ${open ? 'open' : ''}>
      <summary>📒 3년 기록장 (${s.log.length})</summary>
      <div class="log-list" id="logList">${items}</div>
    </details>`;
}

function stageHTML() {
  if (quiz && (s.phase === 'exam' || s.phase === 'final')) return quizHTML();
  switch (s.phase) {
    case 'welcome': return welcomeHTML();
    case 'roulette': return rouletteHTML();
    case 'pack': return packHTML();
    case 'shop': return shopHTML();
    case 'calendar': return calendarHTML();
    case 'calendarResult': return resultHTML('afterCalendar', '계속 →');
    case 'event': return eventHTML();
    case 'eventResult': return resultHTML('afterEvent', '계속 →');
    case 'random': return randomHTML();
    case 'randomResult': return resultHTML('afterRandom', '계속 →');
    case 'exam': return examHTML();
    case 'examResult': return examResultHTML();
    case 'summary': return summaryHTML();
    case 'final': return finalHTML();
    case 'ending':
    case 'gameover': return endingHTML();
  }
  return '<div class="card">알 수 없는 화면</div>';
}

// ---------- 화면 그리기 ----------
function render() {
  const app = document.getElementById('app');
  const top = document.getElementById('topActions');

  if (!s) {   // 게임 시작 전
    top.innerHTML = updateBadgeHTML();
    if (preScreen === 'title') app.innerHTML = titleHTML();
    else if (preScreen === 'name') app.innerHTML = nameHTML();
    else if (preScreen === 'birth') app.innerHTML = birthHTML();
    else app.innerHTML = focusHTML();
    const input = document.getElementById('nameInput');
    if (input) input.focus();
    return;
  }

  if (gameFinished()) recordAchievements();
  top.innerHTML = updateBadgeHTML() + `<button class="btn ghost" data-action="reset">${resetArmed ? '정말? 한 번 더 누르기' : '처음부터'}</button>`;
  app.innerHTML = `<div class="grid">${playerHTML()}<main>${stageHTML()}</main></div>${logHTML()}`;
  const stageCard = app.querySelector('main .card');
  if (stageCard && !gameFinished() && s.phase !== 'welcome' && s.phase !== 'final') {
    const crisis = [];
    for (const k of STATS) if (s.stats[k] < CONFIG.DANGER_LINE) crisis.push(`${STAT_EMOJI[k]} ${STAT_NAME[k]} ${s.stats[k]}: 위험선 아래! ${s.lowStreak[k] ? '이번 시기 안에 못 올리면 전학' : ''}`);
    if (s.stress >= 85) crisis.push(`😵 스트레스 ${s.stress}: 번아웃 직전!`);
    if (s.penalty >= CONFIG.PENALTY_OUT - 6) crisis.push(`🚨 벌점 ${s.penalty}/${CONFIG.PENALTY_OUT}: 한 번만 더 걸리면 퇴사!`);
    if (crisis.length) stageCard.insertAdjacentHTML('afterbegin', `<div class="crisis">${crisis.map(c => `<span>${c}</span>`).join('')}</div>`);
  }
  if (stageCard && lastPhase !== s.phase && ((s.result && s.result.bad && s.phase.endsWith('Result')) || s.phase === 'gameover')) stageCard.classList.add('shake');
  if (newVersionReady && gameFinished()) {
    const stage = app.querySelector('main .card');
    if (stage) stage.insertAdjacentHTML('beforeend', `<div class="info update-note">✨ <b>새 버전이 나왔어요!</b> '다시 입학하기'를 누르면 새 버전으로 시작돼요.</div>`);
  }

  // 능력치 바: 이전 값에서 새 값으로 부드럽게 늘어나게
  requestAnimationFrame(() => {
    document.querySelectorAll('.bar i[data-to]').forEach(el => { el.style.width = el.dataset.to + '%'; });
  });
  const list = document.getElementById('logList');
  if (list) list.scrollTop = list.scrollHeight;

  // 화면이 바뀌면 (모바일에서) 스테이지가 보이게 위로
  if (lastPhase !== s.phase && window.innerWidth <= 780) {
    const main = app.querySelector('main');
    if (main) main.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  lastPhase = s.phase;
  prevStats = Object.assign({}, s.stats);
  saveGame();
}

// ---------- 돌림판 회전 애니메이션 ----------
function spinWheel() {
  if (spinning || s.spun) return;
  const res = spinRoulette(s);   // ① 결과는 확률(random)로 먼저 정해지고
  if (!res) return;
  saveGame();
  spinning = true;

  // ② 그 칸이 바늘(위쪽) 아래에 멈추도록 회전 각도를 계산한다
  let start = 0;
  for (let i = 0; i < res.index; i++) start += ROULETTE[i].chance * 3.6;
  const size = ROULETTE[res.index].chance * 3.6;
  const target = start + size * (0.2 + Math.random() * 0.6);   // 칸 안쪽 아무 곳
  const want = (360 - target) % 360;
  let delta = want - (wheelAngle % 360);
  if (delta < 0) delta += 360;
  wheelAngle += 360 * 5 + delta;   // 5바퀴 + 남은 각도

  const wheel = document.getElementById('wheel');
  const btn = document.getElementById('spinBtn');
  if (btn) { btn.disabled = true; btn.textContent = '빙글빙글…'; }
  wheel.style.transition = 'transform 4s cubic-bezier(.15,.75,.1,1)';
  wheel.style.transform = `rotate(${wheelAngle}deg)`;

  setTimeout(() => { spinning = false; render(); }, 4200);   // ③ 멈춘 뒤 결과 표시
}

// ---------- 버튼 클릭 처리 (이벤트 처리의 중심) ----------
function handleAction(action, id) {
  if (action !== 'reset') resetArmed = false;
  // 판이 끝났고 새 버전이 기다리고 있으면, 다음 판은 새 버전으로
  if (newVersionReady && gameFinished() && (action === 'new' || action === 'home')) {
    applyUpdate(action === 'new' ? 'name' : 'title');
    return;
  }
  if (newVersionReady && action === 'reset' && resetArmed) {   // '처음부터'로 판을 포기해도 새 버전으로
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    applyUpdate('title');
    return;
  }
  justUpdated = false;
  if (['reset', 'continue', 'focus', 'new', 'home'].includes(action)) { quiz = null; quizSummary = null; clearInterval(quizTimer); }
  switch (action) {
    case 'new': s = null; preScreen = 'name'; draftName = ''; quiz = null; quizSummary = null; break;
    case 'continue': s = loadGame(); prevStats = null; lastPhase = null; wheelAngle = 0; break;
    case 'home': s = null; preScreen = 'title'; quiz = null; quizSummary = null; break;
    case 'setName': {
      const input = document.getElementById('nameInput');
      const name = input.value.trim();
      if (!name) { document.getElementById('nameMsg').textContent = '이름을 한 글자 이상 적어 줘!'; return; }
      draftName = name; preScreen = 'focus'; break;
    }
    case 'backName': preScreen = 'name'; break;
    case 'focus': draftFocus = id; preScreen = 'birth'; break;
    case 'birth': s = newGame(draftName, draftFocus, id === 'random' ? 0 : Number(id)); prevStats = Object.assign({}, s.stats); wheelAngle = 0; break;
    case 'backFocus': preScreen = 'focus'; break;
    case 'start': startTurn(s); break;
    case 'spin': spinWheel(); return;
    case 'toShop': goShop(s); break;
    case 'biweekly': chooseHome(s, id); break;
    case 'packPick': packPick = id; break;
    case 'packTo': if (packPick) packItem(s, packPick, id); packPick = null; break;
    case 'leavePack': leavePack(s); packPick = null; break;
    case 'buy': buyItem(s, id); break;
    case 'leaveShop': leaveShop(s); break;
    case 'special': doSpecial(s, id); break;
    case 'afterEvent': afterEventResult(s); break;
    case 'randomChoice': chooseRandom(s, Number(id)); break;
    case 'calendarChoice': chooseCalendar(s, Number(id)); break;
    case 'afterCalendar': afterCalendarResult(s); break;
    case 'afterRandom': afterRandomResult(s); break;
    case 'quizStart': beginQuiz(); return;
    case 'quizAnswer': answerQuiz(Number(id)); return;
    case 'quizHint': hintQuiz(); return;
    case 'exam': takeExam(s); quizSummary = null; break;
    case 'afterExam': afterExamResult(s); break;
    case 'nextTurn': nextTurn(s); break;
    case 'final': takeFinalExam(s); quizSummary = null; break;
    case 'reset':
      if (!resetArmed) { resetArmed = true; break; }
      resetArmed = false;
      try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
      s = null; preScreen = 'title'; break;
  }
  render();
}

// 버튼마다 따로 연결하지 않고, 문서 전체에서 클릭을 한 번에 받는다 (이벤트 위임)
document.addEventListener('click', e => {
  const btn = e.target.closest('[data-action]');
  if (!btn || btn.disabled) return;
  handleAction(btn.dataset.action, btn.dataset.id);
});

// 키보드 입력: 이름 칸에서 Enter = '다음' 버튼 (파이썬 input() 대신 쓰는 방식)
document.addEventListener('keydown', e => {
  if (e.target.id === 'nameInput') {
    draftName = e.target.value;
    if (e.key === 'Enter' && !e.isComposing) handleAction('setName');
  }
});
document.addEventListener('input', e => { if (e.target.id === 'nameInput') draftName = e.target.value; });

// 기록장 펼침 상태 기억
document.addEventListener('toggle', e => { if (e.target.id === 'logBox') logOpen = e.target.open; }, true);

// 방금 새 버전으로 새로고침됐다면 하던 화면으로 이어 준다
(function afterUpdate() {
  const next = sessionGet('pungsan-next');
  if (!next) return;
  sessionDel('pungsan-next');
  justUpdated = true;
  if (next === 'name') preScreen = 'name';
  if (location.search) history.replaceState(null, '', location.pathname);   // 주소창의 ?v= 지우기
})();

// claude.ai 에서 페이지가 업데이트될 때 하던 게임을 그대로 이어 가기
window.claude?.hot?.snapshot?.(() => ({ s: s, preScreen: preScreen, draftName: draftName }));
function boot(data) {
  if (data && data.s) { s = data.s; preScreen = data.preScreen || 'title'; draftName = data.draftName || ''; }
  render();   // 첫 화면 그리기
}
if (window.claude?.hot?.ready) window.claude.hot.ready(boot);
else boot(window.claude?.hot?.data ?? {});

checkVersion();
setInterval(checkVersion, VERSION_CHECK_MS);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkVersion(); });
</script>
