<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>풍산고에서 졸업하기</title>
<style>
  :root {
    --bg: #f4f1ea;
    --card: #ffffff;
    --ink: #1f2430;
    --muted: #6b7080;
    --line: #e3ded3;
    --accent: #2f5d8a;
    --accent-ink: #ffffff;
    --danger: #c0392b;
    --warn: #d68910;
    --c-지능: #3b6fb6;
    --c-체력: #2e8b57;
    --c-사회성: #c4703a;
    --c-명성: #9b59b6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d;
      --card: #20232b;
      --ink: #e8e9ec;
      --muted: #9aa0ad;
      --line: #333743;
      --accent: #5b8fc7;
      --accent-ink: #0d1117;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    line-height: 1.6;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 32px 16px 48px;
  }
  header h1 { margin: 0 0 4px; font-size: 1.8rem; }
  header p { margin: 0 0 24px; color: var(--muted); }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .turn-row {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 12px;
  }
  .turn { font-size: 1.25rem; font-weight: 700; }
  .exam-tag { font-size: .85rem; color: var(--muted); }
  .stat { margin: 10px 0; }
  .stat-label {
    display: flex; justify-content: space-between;
    font-size: .95rem; margin-bottom: 4px;
  }
  .stat-label .warn { color: var(--danger); font-weight: 700; }
  .bar {
    height: 12px; border-radius: 6px; background: var(--line); overflow: hidden;
    position: relative;
  }
  .bar > span {
    display: block; height: 100%; border-radius: 6px;
    transition: width .35s ease;
  }
  .bar .danger-line {
    position: absolute; top: 0; bottom: 0; left: 25%;
    width: 2px; background: var(--danger); opacity: .5;
  }
  #log {
    min-height: 140px;
    white-space: pre-wrap;
    font-size: .98rem;
  }
  #log p { margin: 0 0 6px; }
  #log .warn { color: var(--warn); font-weight: 600; }
  #log .bad { color: var(--danger); font-weight: 700; }
  #log .big { font-size: 1.15rem; font-weight: 700; }
  #buttons {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 10px;
  }
  button {
    font: inherit;
    padding: 12px 10px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
    transition: transform .08s, border-color .15s;
  }
  button:hover { border-color: var(--accent); }
  button:active { transform: scale(.97); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  button small { display: block; color: var(--muted); font-size: .78rem; }
  button.primary small { color: inherit; opacity: .8; }
  #status[hidden] { display: none; }
  footer { text-align: center; color: var(--muted); font-size: .85rem; margin-top: 24px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>🏫 풍산고에서 졸업하기</h1>
    <p>15턴을 버티고 무사히 졸업하자!</p>
  </header>

  <section class="card" id="status" hidden>
    <div class="turn-row">
      <span class="turn" id="turn">1/15턴</span>
      <span class="exam-tag" id="examTag"></span>
    </div>
    <div id="bars"></div>
  </section>

  <section class="card">
    <div id="log"></div>
  </section>

  <section id="buttons"></section>

  <footer>시험 턴: 3 · 6 · 9 · 12 · 15 &nbsp;|&nbsp; 매 턴 모든 능력치 -3</footer>
</main>

<script>
// ----- 1. 게임 설정 -----
const STATS = ["지능", "체력", "사회성", "명성"];
const DECAY = 3;                 // 매 턴이 끝나면 모든 능력치가 3씩 줄어든다
const DANGER = 25;               // 지능·체력·사회성이 25 미만으로 2턴 연속이면 전학
const LAST_TURN = 15;            // 15턴을 마치면 졸업
const EXAM_TURNS = [3, 6, 9, 12, 15];
const ACTIVITIES = {
  "자습":     { "지능": 10, "체력": -3 },
  "체단실":   { "체력": 10, "지능": -2 },
  "장기자랑": { "사회성": 8, "명성": 8 },
  "무단외출": { "사회성": 15, "명성": 15 },
};
const ACTIVITY_HINT = {
  "자습": "지능+10 체력-3",
  "체단실": "체력+10 지능-2",
  "장기자랑": "사회성+8 명성+8",
  "무단외출": "사회성·명성+15 (15% 퇴학)",
};
const OUTING_SUCCESS = 85;       // 무단외출 성공 확률(%)

const randint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

// ----- 2. 게임 규칙 함수 -----
function newGame(focus) {
  const stats = { "지능": 50, "체력": 50, "사회성": 50, "명성": 50 };
  stats[focus] = 60;
  return { 턴: 1, 능력치: stats, 위험: { "지능": 0, "체력": 0, "사회성": 0 }, 시험: [], 결과: "진행중" };
}

function change(game, effects) {
  for (const stat in effects) {
    game.능력치[stat] = Math.max(0, Math.min(100, game.능력치[stat] + effects[stat]));
  }
}

function doActivity(game, name) {
  if (name === "무단외출" && randint(1, 100) > OUTING_SUCCESS) {
    game.결과 = "퇴학";
    return ["🚨 무단외출이 사감 선생님께 걸렸다!", "bad"];
  }
  change(game, ACTIVITIES[name]);
  return ["✅ " + name + " 성공!", ""];
}

function takeExam(game) {
  const score = game.능력치["지능"] + randint(-10, 10);
  let grade;
  if (score >= 80) grade = 1;
  else if (score >= 65) grade = 2;
  else if (score >= 50) grade = 3;
  else if (score >= 35) grade = 4;
  else grade = 5;
  game.시험.push(grade);
  return grade;
}

function endTurn(game) {
  for (const stat of STATS) change(game, { [stat]: -DECAY });
  for (const stat in game.위험) {
    if (game.능력치[stat] < DANGER) game.위험[stat] += 1;
    else game.위험[stat] = 0;
    if (game.위험[stat] >= 2) game.결과 = "전학";
  }
  if (game.결과 === "진행중") {
    if (game.턴 === LAST_TURN) game.결과 = "졸업";
    else game.턴 += 1;
  }
}

function ending(game) {
  const s = game.능력치;
  const average = game.시험.reduce((a, b) => a + b, 0) / game.시험.length;
  if (s["지능"] >= 70 && average <= 2.5) return "📚 명문대 진학 엔딩: 뛰어난 성적으로 원하던 대학에 갔다!";
  if (s["체력"] >= 70) return "🏋️ 체육계 진출 엔딩: 체단실에서 다진 체력으로 운동선수가 되었다!";
  if (s["명성"] >= 70) return "⭐ 풍산고 스타 엔딩: 모두가 이름을 아는 유명한 졸업생이 되었다!";
  return "🎓 평범한 졸업 엔딩: 특별하진 않아도 무사히 3년을 마쳤다.";
}

// ----- 3. 화면 -----
const $log = document.getElementById("log");
const $buttons = document.getElementById("buttons");
const $status = document.getElementById("status");
const $turn = document.getElementById("turn");
const $examTag = document.getElementById("examTag");
const $bars = document.getElementById("bars");
let game = null;

const barEls = {};
for (const stat of STATS) {
  const wrap = document.createElement("div");
  wrap.className = "stat";
  wrap.innerHTML = `
    <div class="stat-label"><span class="name">${stat}</span><span class="val">50</span></div>
    <div class="bar"><span style="background:var(--c-${stat})"></span>${stat !== "명성" ? '<i class="danger-line"></i>' : ""}</div>`;
  $bars.appendChild(wrap);
  barEls[stat] = { fill: wrap.querySelector(".bar > span"), val: wrap.querySelector(".val"), name: wrap.querySelector(".name") };
}

function say(text, cls = "") {
  const p = document.createElement("p");
  p.textContent = text;
  if (cls) p.className = cls;
  $log.appendChild(p);
}
function clearLog() { $log.innerHTML = ""; }

function showButtons(names, handler, opts = {}) {
  $buttons.innerHTML = "";
  for (const name of names) {
    const b = document.createElement("button");
    b.textContent = name;
    if (opts.hints && opts.hints[name]) {
      const sm = document.createElement("small");
      sm.textContent = opts.hints[name];
      b.appendChild(sm);
    }
    if (opts.primary) b.className = "primary";
    b.addEventListener("click", () => {
      $buttons.innerHTML = "";   // 중복 클릭 방지
      handler(name);
    }, { once: true });
    $buttons.appendChild(b);
  }
}

function showStatus() {
  $status.hidden = false;
  $turn.textContent = `${game.턴}/${LAST_TURN}턴`;
  $examTag.textContent = EXAM_TURNS.includes(game.턴) && game.결과 === "진행중" ? "📋 이번 턴은 시험!" : "";
  for (const stat of STATS) {
    const v = game.능력치[stat];
    barEls[stat].fill.style.width = v + "%";
    barEls[stat].val.textContent = v;
    const danger = stat in game.위험 && v < DANGER;
    barEls[stat].val.className = danger ? "val warn" : "val";
  }
}

function showTitle() {
  game = null;
  $status.hidden = true;
  clearLog();
  say("🏫 풍산고에서 졸업하기! 15턴을 버티면 졸업한다.", "big");
  say("지능·체력·사회성이 25 미만으로 2턴 연속이면 전학.");
  say("집중할 능력치를 골라 입학하자! (그 능력치는 60, 나머지는 50으로 시작)");
  showButtons(STATS, onStart, { primary: true });
}

function onStart(focus) {
  game = newGame(focus);
  clearLog();
  startTurn();
}

function startTurn() {
  showStatus();
  clearLog();
  say(`📅 ${game.턴}턴 시작! 무엇을 할까?`, "big");
  showButtons(Object.keys(ACTIVITIES), onActivity, { hints: ACTIVITY_HINT });
}

function onActivity(name) {
  const [msg, cls] = doActivity(game, name);
  say(msg, cls);
  if (game.결과 === "진행중") {
    if (EXAM_TURNS.includes(game.턴)) say(`📋 시험 결과: ${takeExam(game)}등급`);
    endTurn(game);
  }
  showStatus();
  for (const stat in game.위험) {
    if (game.위험[stat] === 1) say(`⚠️ ${stat}이(가) 25 미만! 다음 턴에도 낮으면 전학이다.`, "warn");
  }
  if (game.결과 === "진행중") showButtons(["다음 턴"], startTurn, { primary: true });
  else showButtons(["결과 보기"], onResult, { primary: true });
}

function onResult() {
  clearLog();
  if (game.결과 === "졸업") {
    say("🎓 졸업 성공!", "big");
    say(ending(game));
  } else {
    say(`💀 게임 오버: ${game.결과} (${game.턴}턴)`, "big bad");
  }
  for (const stat of STATS) say(`  ${stat}: ${game.능력치[stat]}`);
  if (game.시험.length) say(`  시험 등급: ${game.시험.join(" → ")}`);
  showButtons(["다시 하기"], showTitle, { primary: true });
}

showTitle();
</script>
</body>
</html>
